spring.application.name=blood-donor-network

# ---------- PostgreSQL ----------
# Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_donor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only checks that the
# entities match it and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# A database created earlier by Hibernate (ddl-auto=update) already has the V1 tables:
# mark it as version 1 instead of failing, then apply V2+ normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---------- Business rules ----------
app.min-days-between-donations=90
app.min-donor-age=18
app.max-donor-age=65
app.initial-radius-km=10
app.radius-step-km=10
app.max-radius-km=50
app.expand-after-minutes=30
app.max-donors-per-search=25
app.sample-data=true

# ---------- SMS ----------
# "log" = print messages to the console (default). "twilio" = really send SMS (needs the env vars below).
app.sms.provider=${SMS_PROVIDER:log}
# "sms" or "whatsapp" (Twilio WhatsApp sandbox: TWILIO_FROM_NUMBER=+14155238886)
app.sms.channel=${SMS_CHANNEL:sms}
app.sms.country-code=+91
# While testing, real SMS go ONLY to these numbers (comma separated); everyone else is just logged.
# The sample donors use made-up numbers that may belong to real people, so keep this set.
app.sms.allowed-numbers=${SMS_ALLOWED_NUMBERS:}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# ---------- OTP (one-time codes by SMS) ----------
app.otp.required-for-register=true
app.otp.valid-minutes=5
app.otp.max-attempts=5
app.otp.resend-after-seconds=30
app.otp.max-per-hour=5
# While app.sms.provider=log, the code is also returned by the API so you can test without a phone.
# It is never returned when real SMS are sent.
app.otp.show-code-in-dev=true

# ---------- Security (JWT) ----------
# The defaults are for local development only; set the env vars in any shared/production environment.
app.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
# Short-lived access token; the browser renews it silently with the refresh cookie.
app.security.jwt-expiry-minutes=15
app.security.refresh-token-days=14
# true in production (https only). Left false so http://localhost works.
app.security.cookie-secure=${COOKIE_SECURE:false}
# Brute-force protection: lock a username after N failed logins, block an IP after M, for lock-minutes
app.security.max-failed-logins=5
app.security.lock-minutes=15
app.security.max-failed-logins-per-ip=20
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}

# ---------- Scheduled jobs (Spring cron: sec min hour day month weekday, "-" = off) ----------
jobs.expand-search.cron=0 */5 * * * *
jobs.expire-requests.cron=0 */5 * * * *
jobs.eligibility-reminder.cron=0 0 9 * * *
jobs.refresh-token-cleanup.cron=0 30 3 * * *

# ---------- API docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
