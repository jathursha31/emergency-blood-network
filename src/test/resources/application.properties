# Tests run on in-memory H2 (PostgreSQL mode), so no database install is needed to run them.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Same as production: Flyway builds the schema (H2 runs the PostgreSQL-compatible migrations),
# Hibernate validates it against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.sample-data=false

jobs.expand-search.cron=-
jobs.expire-requests.cron=-
jobs.eligibility-reminder.cron=-

jobs.refresh-token-cleanup.cron=-

# Many tests log in from 127.0.0.1; keep the IP block out of their way (LoginGuardTest covers it with fake IPs)
app.security.max-failed-logins-per-ip=1000
