# Run the whole stack (PostgreSQL + API) with one command:
#   docker compose up --build
# Then open http://localhost:8080 (web app) or http://localhost:8080/swagger-ui.html (API)
#
# Optional overrides (shell env vars or a .env file next to this file):
#   APP_PORT, DB_PASSWORD, JWT_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: blood_donor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<version>/
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blood_donor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not published to the host, so it never clashes with a locally installed PostgreSQL on 5432.

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/blood_donor
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # set to true when the app is served over https
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # SMS: "log" (default) or "twilio" (see README, "SMS notifications")
      SMS_PROVIDER: ${SMS_PROVIDER:-log}
      SMS_CHANNEL: ${SMS_CHANNEL:-sms}
      SMS_ALLOWED_NUMBERS: ${SMS_ALLOWED_NUMBERS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
