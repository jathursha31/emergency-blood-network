<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d62839">
    <title>Offline · Blood Donor Network</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #1d2330;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 1rem; box-sizing: border-box; }
        main { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 2rem 1.5rem; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.3rem; margin: 1rem 0 .5rem; }
        p { color: #6b7280; margin: 0 0 1.25rem; line-height: 1.45; }
        button { font: inherit; font-weight: 600; padding: .6rem 1.2rem; border-radius: 8px; border: 0; background: #d62839; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Blood requests change by the minute, so this app only shows live data. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
